<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>Rimal Sales · Q4 W1–W6</title>
<style>
:root{
  --bg:#f2f2f7; --bg-elev:rgba(255,255,255,.72); --card:#fff;
  --label:#000; --label2:rgba(60,60,67,.60); --label3:rgba(60,60,67,.30);
  --sep:rgba(60,60,67,.14);
  --blue:#007aff; --green:#34c759; --red:#ff3b30; --orange:#ff9500;
  --fill:rgba(120,120,128,.12); --fill2:rgba(120,120,128,.16);
  --r:14px; --pad:16px;
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#000; --bg-elev:rgba(28,28,30,.72); --card:#1c1c1e;
    --label:#fff; --label2:rgba(235,235,245,.60); --label3:rgba(235,235,245,.30);
    --sep:rgba(84,84,88,.65);
    --fill:rgba(118,118,128,.24); --fill2:rgba(118,118,128,.32);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font:400 17px/1.47 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;
  background:var(--bg); color:var(--label);
  -webkit-font-smoothing:antialiased;
  padding-bottom:calc(28px + var(--safe-b));
  overscroll-behavior-y:none;
}
.wrap{max-width:720px;margin:0 auto}

/* ---------- translucent chrome ---------- */
header{
  position:sticky; top:0; z-index:20;
  padding:calc(var(--safe-t) + 9px) var(--pad) 9px;
  background:var(--bg-elev);
  backdrop-filter:saturate(180%) blur(20px);
  -webkit-backdrop-filter:saturate(180%) blur(20px);
}
header::after{
  content:""; position:absolute; left:0; right:0; bottom:-14px; height:14px;
  background:linear-gradient(to bottom,var(--bg),transparent); opacity:.9; pointer-events:none;
}
h1{
  margin:0; font-size:17px; line-height:1.1; letter-spacing:-.014em; font-weight:700;
}

/* ---------- segmented control ---------- */
.seg{
  position:relative; display:flex; margin-top:9px; padding:2px; gap:2px;
  background:var(--fill); border-radius:9px;
}
.seg button{
  position:relative; z-index:1; flex:1 1 0; min-width:0; appearance:none; border:0; background:none;
  font-family:inherit; font-weight:600; font-size:13px; line-height:1; letter-spacing:-.01em; color:var(--label);
  padding:7px 4px; border-radius:7px; cursor:pointer;
  transition:transform .1s ease-out, opacity .15s;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.seg button.press{transform:scale(.96)}
.seg button[aria-selected="false"]{color:var(--label2)}
.seg .thumb{
  position:absolute; top:2px; bottom:2px; z-index:0;
  background:var(--card); border-radius:7px;
  box-shadow:0 3px 8px rgba(0,0,0,.10),0 1px 1px rgba(0,0,0,.06);
  transition:transform .34s cubic-bezier(.32,.72,0,1), width .34s cubic-bezier(.32,.72,0,1);
}

/* ---------- week pills ---------- */
.weeks{
  display:flex; gap:7px; overflow-x:auto; padding:9px 0 1px; margin:0 calc(var(--pad) * -1);
  padding-left:var(--pad); padding-right:var(--pad);
  scroll-snap-type:x proximity; -webkit-overflow-scrolling:touch;
  scrollbar-width:none;
}
.weeks::-webkit-scrollbar{display:none}
.pill{
  flex:0 0 auto; scroll-snap-align:center; appearance:none; border:0; cursor:pointer;
  touch-action:pan-x;
  padding:7px 15px; border-radius:100px; background:var(--fill);
  font-family:inherit; font-weight:600; font-size:14px; line-height:1; letter-spacing:-.01em; color:var(--label);
  transition:transform .1s ease-out, background .2s, color .2s;
}
.pill.press{transform:scale(.94)}
.pill[aria-pressed="true"]{background:var(--blue); color:#fff}

.tiers{display:flex; gap:7px; overflow-x:auto; padding:8px 0 1px;
  margin:0 calc(var(--pad) * -1); padding-left:var(--pad); padding-right:var(--pad);
  scrollbar-width:none}
.tiers::-webkit-scrollbar{display:none}
.tpill{
  flex:0 0 auto; appearance:none; border:0; cursor:pointer; touch-action:pan-x;
  padding:6px 12px; border-radius:100px; background:var(--fill);
  font-family:inherit; font-weight:600; font-size:12.5px; letter-spacing:-.01em; color:var(--label2);
  transition:transform .1s ease-out, background .2s, color .2s;
}
.tpill.press{transform:scale(.94)}
.tpill[aria-pressed="true"]{background:var(--label); color:var(--card)}
.wkrow{display:flex; align-items:center; gap:8px}
.wkrow .weeks{flex:1 1 auto; min-width:0}
.cmpbtn{
  flex:0 0 auto; appearance:none; border:0; cursor:pointer;
  padding:7px 13px; border-radius:100px; background:var(--fill);
  font-family:inherit; font-weight:600; font-size:13px; letter-spacing:-.01em; color:var(--label);
  transition:transform .1s ease-out, background .2s, color .2s;
}
.cmpbtn.press{transform:scale(.94)}
.cmpbtn[aria-pressed="true"]{background:var(--blue); color:#fff}

/* ---------- comparison table ---------- */
.cmpwrap{overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none}
.cmpwrap::-webkit-scrollbar{display:none}
table.cmp{border-collapse:collapse; width:100%; font-variant-numeric:tabular-nums}
table.cmp th,table.cmp td{
  padding:10px 10px; text-align:right; white-space:nowrap;
  border-top:.5px solid var(--sep); font-size:14px; letter-spacing:-.01em;
}
table.cmp thead th{
  border-top:0; font-size:12px; font-weight:600; color:var(--label2);
  letter-spacing:.02em; padding-bottom:8px;
}
table.cmp .lbl{
  position:sticky; left:0; z-index:1; background:var(--card);
  text-align:left; max-width:150px; overflow:hidden; text-overflow:ellipsis;
  font-size:14.5px; font-weight:500;
}
table.cmp thead .lbl{background:var(--card)}
table.cmp .sub{display:block; font-size:12px; color:var(--label2); font-weight:400; letter-spacing:0}
table.cmp .tot{font-weight:600}
table.cmp tr.apple .lbl{color:var(--blue)}
table.cmp tr.tierrow.tappable{cursor:pointer}
table.cmp tr.tierrow.press td{background:var(--fill)}
table.cmp .tw{display:inline-block; width:11px; color:var(--label3); font-weight:700;
  transition:transform .28s cubic-bezier(.32,.72,0,1)}
table.cmp tr.tierrow[aria-expanded="true"] .tw{transform:rotate(90deg); color:var(--blue)}
table.cmp tr.modelrow td{background:color-mix(in srgb,var(--blue) 5%,var(--card)); font-size:13px}
table.cmp td.mdl{padding-left:22px; font-weight:400}
table.cmp td.yoy{font-weight:600}
table.cmp td.yoy.up{color:var(--green)}
table.cmp td.yoy.dn{color:var(--red)}
table.cmp td.yoy.flat{color:var(--label2)}
.cmphint{padding:22px 16px; text-align:center; color:var(--label2); font-size:15px}

/* ---------- cards ---------- */
main{padding:2px var(--pad) 0}
.card{
  background:var(--card); border-radius:var(--r); margin-top:14px; overflow:hidden;
  box-shadow:0 1px 2px rgba(0,0,0,.05);
}
.card-h{padding:14px 16px 0}
.card-t{
  margin:0; font-size:13px; font-weight:600; letter-spacing:.02em; text-transform:uppercase;
  color:var(--label2);
}

/* hero */
.hero{padding:14px 16px 18px; display:flex; align-items:flex-end; gap:14px; flex-wrap:wrap}
.big{
  font-size:clamp(40px,13vw,56px); line-height:.94; letter-spacing:-.032em; font-weight:700;
  font-variant-numeric:tabular-nums; margin:0;
}
.big small{font-size:.34em; font-weight:600; letter-spacing:-.01em; color:var(--label2); margin-left:6px}
.delta{
  display:inline-flex; align-items:center; gap:3px; padding:5px 10px; border-radius:100px;
  font-family:inherit; font-weight:600; font-size:14px; line-height:1; letter-spacing:-.01em; font-variant-numeric:tabular-nums;
  margin-bottom:5px;
}
.delta.up{background:color-mix(in srgb,var(--green) 16%,transparent); color:var(--green)}
.delta.dn{background:color-mix(in srgb,var(--red) 16%,transparent); color:var(--red)}
.delta.flat{background:var(--fill); color:var(--label2)}

/* share bar */
.prov{margin:-4px 0 0; padding:0 16px 14px; font-size:12.5px; color:var(--orange); letter-spacing:0}
.ynote{margin:-6px 0 0; padding:0 16px 15px; font-size:13px; color:var(--label2); letter-spacing:0}
.share{padding:0 16px 16px}
.bar{
  height:9px; border-radius:100px; background:var(--fill2); overflow:hidden; display:flex;
}
.bar i{display:block; height:100%; background:var(--blue); border-radius:100px;
  transition:width .5s cubic-bezier(.32,.72,0,1)}
.legend{display:flex; justify-content:space-between; margin-top:8px; font-size:13px; color:var(--label2);
  letter-spacing:0; font-variant-numeric:tabular-nums}
.legend b{color:var(--label); font-weight:600}
.legend2{margin-top:3px}
.ow{font-weight:600; font-variant-numeric:tabular-nums}
.ow.up{color:var(--green)} .ow.dn{color:var(--red)} .ow.flat{color:var(--label2)}

/* stat grid */
.grid{display:grid; grid-template-columns:1fr 1fr; gap:1px; background:var(--sep)}
.stat{background:var(--card); padding:13px 16px}
.stat dt{margin:0; font-size:12px; letter-spacing:.01em; color:var(--label2)}
.stat dd{margin:3px 0 0; font-size:21px; font-weight:600; letter-spacing:-.02em;
  font-variant-numeric:tabular-nums}

/* ---------- device rows ---------- */
.row{
  display:flex; align-items:center; gap:12px; padding:11px 16px; cursor:default;
  touch-action:pan-y;
  border-top:.5px solid var(--sep); background:var(--card);
  transition:background .12s ease-out;
}
.row:first-of-type{border-top:0}
.row.tappable{cursor:pointer}
.row.tappable.press{background:var(--fill)}
.chev{
  flex:0 0 13px; width:13px; height:13px; color:var(--label3);
  transition:transform .32s cubic-bezier(.32,.72,0,1), color .2s;
}
.row[aria-expanded="true"] .chev{transform:rotate(90deg); color:var(--blue)}
.chev.hidden{visibility:hidden}
.nm{flex:1 1 auto; min-width:0}
.nm b{display:block; font-size:15px; font-weight:500; letter-spacing:-.012em;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.nm span{display:block; font-size:12.5px; color:var(--label2); letter-spacing:0;
  font-variant-numeric:tabular-nums; margin-top:1px}
.u{
  flex:0 0 auto; font-size:16px; font-weight:600; letter-spacing:-.02em;
  font-variant-numeric:tabular-nums; text-align:right; min-width:34px;
}
.u .ush{display:block; font-size:11.5px; font-weight:500; color:var(--label2);
  letter-spacing:0; margin-top:1px}
.badge{
  flex:0 0 auto; font-size:11px; font-weight:600; letter-spacing:.01em; padding:2px 7px;
  border-radius:100px; background:var(--fill); color:var(--label2);
}
.badge.apple{background:color-mix(in srgb,var(--blue) 15%,transparent); color:var(--blue)}

/* disclosure */
.kids{display:grid; grid-template-rows:0fr; transition:grid-template-rows .34s cubic-bezier(.32,.72,0,1)}
.kids.open{grid-template-rows:1fr}
.kids>div{overflow:hidden; min-height:0}
.kid{
  display:flex; align-items:center; gap:10px; padding:8px 16px 8px 41px;
  background:color-mix(in srgb,var(--blue) 5%,var(--card));
  border-top:.5px solid var(--sep); font-size:13.5px; letter-spacing:-.005em;
}
.kid span{flex:1 1 auto; color:var(--label2); min-width:0}
.kid span em{display:block; font-style:normal; font-size:11.5px; color:var(--label3);
  font-variant-numeric:tabular-nums; margin-top:1px}
.kid b{text-align:right; line-height:1.15}
.kid b i{display:block; font-style:normal; font-weight:500; font-size:11px;
  color:var(--label3); font-variant-numeric:tabular-nums}
.kid b{font-weight:600; font-variant-numeric:tabular-nums}

.srch{
  display:flex; align-items:center; gap:8px; margin:10px 16px 12px;
  padding:8px 10px; background:var(--fill); border-radius:10px;
  color:var(--label2);
}
.srch svg{flex:0 0 16px; width:16px; height:16px}
.srch input{
  flex:1 1 auto; min-width:0; appearance:none; -webkit-appearance:none; border:0; outline:0;
  background:none; font-family:inherit; font-weight:400; font-size:16px; line-height:1.2; letter-spacing:-.01em; color:var(--label);
}
.srch input::-webkit-search-cancel-button{display:none}
.srch input::placeholder{color:var(--label3)}
.srch button{
  flex:0 0 auto; appearance:none; border:0; background:var(--label3); color:var(--card);
  width:18px; height:18px; border-radius:50%; font-family:inherit; font-weight:700; font-size:14px; line-height:1; cursor:pointer;
  display:flex; align-items:center; justify-content:center; padding:0 0 1px;
}
.qnone{margin:0; padding:0 16px 18px; color:var(--label2); font-size:15px; text-align:center}
.row.hide,.kids.hide{display:none}
.empty{padding:26px 16px; text-align:center; color:var(--label2); font-size:15px}
footer{padding:22px var(--pad) 0; color:var(--label3); font-size:12px; letter-spacing:0; text-align:center}

@media (prefers-reduced-motion:reduce){
  *{transition-duration:.01ms !important}
  .kids{transition:none}
  .seg .thumb{transition:none}
}
@media (prefers-reduced-transparency:reduce){
  header{background:var(--bg); backdrop-filter:none; -webkit-backdrop-filter:none}
}

/* ---------- lock screen ---------- */
.lock{
  position:fixed; inset:0; z-index:100; display:flex; align-items:center; justify-content:center;
  padding:24px; background:var(--bg);
  transition:opacity .34s cubic-bezier(.32,.72,0,1);
}
.lock.gone{opacity:0; pointer-events:none}
.lockbox{width:100%; max-width:300px; text-align:center}
.lockicon{
  width:56px; height:56px; margin:0 auto 16px; color:var(--label3);
  display:flex; align-items:center; justify-content:center;
}
.lockicon svg{width:100%; height:100%}
.lockbox h2{margin:0; font-size:24px; letter-spacing:-.021em; font-weight:700}
.lockbox p{margin:5px 0 20px; font-size:14px; color:var(--label2); letter-spacing:0; min-height:20px}
.lockbox p.bad{color:var(--red)}
#pw{
  width:100%; appearance:none; border:0; outline:0; text-align:center;
  font-family:inherit; font-weight:400; font-size:19px; line-height:1; letter-spacing:.28em; text-indent:.28em; color:var(--label);
  background:var(--fill); border-radius:11px; padding:14px;
  transition:box-shadow .2s;
}
#pw:focus{box-shadow:0 0 0 3.5px color-mix(in srgb,var(--blue) 28%,transparent)}
#go{
  width:100%; margin-top:10px; appearance:none; border:0; cursor:pointer;
  font-family:inherit; font-weight:600; font-size:17px; line-height:1; letter-spacing:-.01em; color:#fff;
  background:var(--blue); border-radius:11px; padding:14px;
  transition:transform .1s ease-out, opacity .2s;
}
#go:active{transform:scale(.975)}
#go:disabled{opacity:.5; cursor:default}
.shake{animation:shake .4s cubic-bezier(.36,.07,.19,.97)}
@keyframes shake{
  10%,90%{transform:translateX(-1.5px)} 20%,80%{transform:translateX(3px)}
  30%,50%,70%{transform:translateX(-6px)} 40%,60%{transform:translateX(6px)}
}
@media (prefers-reduced-motion:reduce){ .shake{animation:none} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Rimal Sales</h1>
    <div class="seg" id="seg" role="tablist"><div class="thumb" id="thumb"></div></div>
    <div class="wkrow">
      <div class="weeks" id="weeks"></div>
      <button class="cmpbtn" id="cmp" type="button" aria-pressed="false">Y/Y</button>
    </div>
    <div class="tiers" id="tiers" hidden></div>
  </header>
  <main id="main"></main>
  <footer>Sale + Order Initiate · Apple vs. other brands</footer>
</div>

<div class="lock" id="lock">
  <div class="lockbox">
    <div class="lockicon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none"><path d="M7 10V7a5 5 0 0 1 10 0v3" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/><rect x="4.2" y="10" width="15.6" height="11" rx="3.4" fill="currentColor"/></svg>
    </div>
    <h2>Rimal Sales</h2>
    <p id="lockmsg">Enter passcode to view the report</p>
    <input id="pw" type="password" inputmode="numeric" pattern="[0-9]*"
           autocomplete="current-password" placeholder="Passcode"
           aria-label="Passcode" enterkeyhint="go">
    <button id="go" type="button">View report</button>
  </div>

<script>
let D, CATS;
let cat = 'phones', wk = 'W6', query = '';
let compare = false;
let tier = 'all';
const sel = new Set(['W5','W6']);   // weeks chosen in compare mode

/* Tap that survives scrolling: arm on down, disarm on movement, fire on up.
   Matches UIKit — the highlight appears immediately but is withdrawn the
   moment the gesture turns into a scroll. */
const SLOP = 10;      // px of travel before it's a scroll, not a tap
const HOLD = 900;     // ms after which we assume it's a long-press, not a tap
function onTap(el, fn){
  let sx=0, sy=0, t0=0, armed=false;
  const disarm = ()=>{ armed=false; el.classList.remove('press'); };
  el.addEventListener('pointerdown', e=>{
    if(e.button && e.button!==0) return;
    sx=e.clientX; sy=e.clientY; t0=e.timeStamp; armed=true;
    el.classList.add('press');
  }, {passive:true});
  el.addEventListener('pointermove', e=>{
    if(!armed) return;
    if(Math.hypot(e.clientX-sx, e.clientY-sy) > SLOP) disarm();
  }, {passive:true});
  el.addEventListener('pointerup', e=>{
    const go = armed && (e.timeStamp - t0) < HOLD;
    disarm();
    if(go) fn(e);
  });
  el.addEventListener('pointercancel', disarm);
  el.addEventListener('pointerleave', disarm);
  el.addEventListener('contextmenu', e=>e.preventDefault());
}

const nf = n => n.toLocaleString('en-US');
const pf = n => (n*100).toFixed(1)+'%';
const money = n => n.toLocaleString('en-US',{maximumFractionDigits:0});

/* ---- segmented control ---- */
const seg = document.getElementById('seg'), thumb = document.getElementById('thumb');
function buildSeg(){
  CATS.forEach(k=>{
    const b=document.createElement('button');
    b.type='button'; b.role='tab'; b.dataset.k=k;
    b.textContent=D.categories[k].label.replace('Smartphones','Phones').replace('Apple Watch','Watch');
    onTap(b, ()=>{ if(k!==cat){ cat=k; render(); } });
    seg.appendChild(b);
  });
}
function moveThumb(){
  const btns=[...seg.querySelectorAll('button')];
  const i=CATS.indexOf(cat), el=btns[i];
  btns.forEach((b,j)=>b.setAttribute('aria-selected', j===i));
  thumb.style.width=el.offsetWidth+'px';
  thumb.style.transform=`translateX(${el.offsetLeft-2}px)`;
}

/* ---- week pills ---- */
const weeksEl=document.getElementById('weeks');
function buildWeeks(){
  D.weeks.forEach(w=>{
    const b=document.createElement('button');
    b.type='button'; b.className='pill'; b.dataset.w=w;
    b.textContent = w==='ALL' ? 'All weeks' : w;
    onTap(b, ()=>{
      if(compare){
        if(w==='ALL') return;                 // aggregate can't be a comparison column
        if(sel.has(w)){ if(sel.size>1) sel.delete(w); }   // keep at least one
        else sel.add(w);
      } else if(w!==wk){ wk=w; }
      render();
    });
    weeksEl.appendChild(b);
  });
}

const tiersEl = document.getElementById('tiers');
function buildTiers(){
  const T = D.categories.phones && D.categories.phones.tiers;
  if(!T) return;
  [['all','All'], ...T.order.map(k=>[k, T.names[k]])].forEach(([k,label])=>{
    const b=document.createElement('button');
    b.type='button'; b.className='tpill'; b.dataset.t=k; b.textContent=label;
    onTap(b, ()=>{ if(tier!==k){ tier=k; render(); } });
    tiersEl.appendChild(b);
  });
}

const cmpBtn = document.getElementById('cmp');
onTap(cmpBtn, ()=>{
  compare = !compare;
  if(compare && !sel.size) sel.add(wk);
  render();
});

/* tier data exists for phones only */
function C_tiers(){ return cat==='phones' ? D.categories.phones.tiers : null; }
/* units for the active tier in a given week — falls back to the whole category */
function tierUnits(w, side){
  const T=C_tiers(); if(!T) return null;
  if(tier==='all') return side==='ty' ? D.categories.phones.weeks[w].apple
                                      : (D.categories.phones.lastYear[w] ?? null);
  return (T[side][tier] || {})[w] ?? null;
}

/* a device row belongs to the active tier (non-Apple rows drop out when filtering) */
function inTier(x){
  const T=C_tiers();
  if(!T || tier==='all') return true;
  return x.brand==='APPLE' && T.deviceTier[x.device]===tier;
}

function prevWeek(w){ const i=D.weeks.indexOf(w); return (w==='ALL'||i<=0)?null:D.weeks[i-1]; }

/* ---- comparison view: weeks become columns ---- */
function renderCompare(){
  const C=D.categories[cat], m=document.getElementById('main');
  const cols = D.weeks.filter(w=>w!=='ALL' && sel.has(w));   // keep W1..Wn order
  if(!cols.length){ m.innerHTML='<section class="card"><p class="cmphint">Pick at least one week</p></section>'; return; }

  const th = w => `<th>${w}</th>`;
  let h='';

  /* year over year for exactly the weeks chosen */
  const T = C_tiers();
  const ty = cols.map(w=> T && tier!=='all' ? tierUnits(w,'ty') : C.weeks[w].apple);
  const tySum = ty.reduce((a,b)=>a+b,0);
  const lyRaw = cols.map(w=> T && tier!=='all' ? tierUnits(w,'ly')
                                               : (C.lastYear ? C.lastYear[w] : null));
  const hasLY = lyRaw.every(v=> typeof v === 'number');
  const ly = hasLY ? lyRaw : null;
  const lySum = hasLY ? ly.reduce((a,b)=>a+b,0) : 0;
  const yoyCell = (a,b) => {
    if(!b) return '<td>—</td>';
    const x=(a-b)/b, k=x>0?'up':(x<0?'dn':'flat');
    return `<td class="yoy ${k}">${x>0?'▲':(x<0?'▼':'')}${Math.abs(x*100).toFixed(1)}%</td>`;
  };

  const tierLabel = (T && tier!=='all') ? ` · ${T.names[tier]}` : '';
  h+=`<section class="card"><div class="card-h"><p class="card-t">${C.label}${tierLabel} · year over year</p></div>
    <div class="cmpwrap"><table class="cmp"><thead><tr><th class="lbl">&nbsp;</th>${cols.map(th).join('')}<th>Total</th></tr></thead><tbody>`;
  h+=`<tr class="apple"><td class="lbl">This year</td>${ty.map(v=>`<td class="tot">${nf(v)}</td>`).join('')}<td class="tot">${nf(tySum)}</td></tr>`;
  if(hasLY){
    h+=`<tr><td class="lbl">Last year<span class="sub">Q4 '25</span></td>${ly.map(v=>`<td>${nf(v)}</td>`).join('')}<td class="tot">${nf(lySum)}</td></tr>`;
    h+=`<tr><td class="lbl">Y/Y</td>${cols.map((w,i)=>yoyCell(ty[i], ly[i])).join('')}${yoyCell(tySum, lySum)}</tr>`;
  }
  h+=`</tbody></table></div></section>`;

  /* where the change is coming from */
  if(T && tier==='all'){
    h+=`<section class="card"><div class="card-h"><p class="card-t">By tier · Y/Y</p></div>
      <div class="cmpwrap"><table class="cmp"><thead><tr><th class="lbl">&nbsp;</th>${
        cols.map(th).join('')}<th>Total</th><th>Y/Y</th></tr></thead><tbody>`;
    T.order.forEach((k,ti)=>{
      const a = cols.map(w=> (T.ty[k]||{})[w] ?? 0);
      const b = cols.map(w=> (T.ly[k]||{})[w] ?? 0);
      const aS=a.reduce((x,y)=>x+y,0), bS=b.reduce((x,y)=>x+y,0);
      const kids=(T.models&&T.models[k])||[];
      h+=`<tr class="tierrow${kids.length?' tappable':''}" ${kids.length?`data-t="${ti}" aria-expanded="false" role="button" tabindex="0"`:''}>
        <td class="lbl">${kids.length?'<span class="tw">›</span>':''}${T.names[k]}<span class="sub">vs ${nf(bS)} last year</span></td>${
        a.map(v=>`<td>${nf(v)}</td>`).join('')}<td class="tot">${nf(aS)}</td>${yoyCell(aS,bS)}</tr>`;
      kids.forEach(m=>{
        const mv = cols.map(w=> m.tyW[w] ?? 0);
        const mS = mv.reduce((x,y)=>x+y,0);
        const lS = m.lyW ? cols.reduce((x,w)=> x + (m.lyW[w] ?? 0), 0) : null;
        h+=`<tr class="modelrow t${ti}" hidden>
          <td class="lbl mdl">${m.ty}<span class="sub">${m.ly ? 'vs '+m.ly+' · '+nf(lS) : 'no prior model'}</span></td>${
          mv.map(v=>`<td>${nf(v)}</td>`).join('')}<td class="tot">${nf(mS)}</td>${
          lS ? yoyCell(mS,lS) : '<td>—</td>'}</tr>`;
      });
    });
    h+=`</tbody></table></div></section>`;
  }

  /* the rest of the picture, same weeks */
  if(!C.appleOnly && tier==='all'){
    const oth = cols.map(w=>C.weeks[w].other);
    const othSum = oth.reduce((a,b)=>a+b,0);
    const LO = C.lastYearOther;
    const lyOthRaw = cols.map(w=> LO ? LO[w] : null);
    const hasLO = lyOthRaw.every(v=> typeof v === 'number');
    const lyOth = hasLO ? lyOthRaw : null;
    const lyOthSum = hasLO ? lyOth.reduce((a,b)=>a+b,0) : 0;
    /* share in percentage points, not a percentage of a percentage */
    const ppCell = (a,b)=>{
      if(a==null||b==null) return '<td>—</td>';
      const dp=(a-b)*100, k=dp>0?'up':(dp<0?'dn':'flat');
      return `<td class="yoy ${k}">${dp>0?'▲':(dp<0?'▼':'')}${Math.abs(dp).toFixed(1)}pp</td>`;
    };
    const shareTY = w => C.weeks[w].share;
    const shareLY = w => (hasLY && hasLO && (ly[cols.indexOf(w)]+LO[w]))
                          ? ly[cols.indexOf(w)]/(ly[cols.indexOf(w)]+LO[w]) : null;

    h+=`<section class="card"><div class="card-h"><p class="card-t">Competitors &amp; share · Y/Y</p></div>
      <div class="cmpwrap"><table class="cmp"><thead><tr><th class="lbl">&nbsp;</th>${cols.map(th).join('')}<th>Total</th></tr></thead><tbody>`;
    h+=`<tr><td class="lbl">Others this year</td>${oth.map(v=>`<td class="tot">${nf(v)}</td>`).join('')}<td class="tot">${nf(othSum)}</td></tr>`;
    if(hasLO){
      h+=`<tr><td class="lbl">Others last year</td>${lyOth.map(v=>`<td>${nf(v)}</td>`).join('')}<td class="tot">${nf(lyOthSum)}</td></tr>`;
      h+=`<tr><td class="lbl">Others Y/Y</td>${cols.map((w,i)=>yoyCell(oth[i], lyOth[i])).join('')}${yoyCell(othSum, lyOthSum)}</tr>`;
    }
    h+=`<tr><td class="lbl">Apple share</td>${cols.map(w=>`<td>${pf(shareTY(w))}</td>`).join('')}<td class="tot">${pf(tySum/(tySum+othSum))}</td></tr>`;
    if(hasLO && hasLY){
      h+=`<tr><td class="lbl">Apple share last year</td>${cols.map(w=>{
            const v=shareLY(w); return `<td>${v==null?'—':pf(v)}</td>`; }).join('')}<td class="tot">${
            pf(lySum/(lySum+lyOthSum))}</td></tr>`;
      h+=`<tr><td class="lbl">Share change</td>${cols.map(w=>ppCell(shareTY(w), shareLY(w))).join('')}${
            ppCell(tySum/(tySum+othSum), lySum/(lySum+lyOthSum))}</tr>`;
    }
    h+=`<tr><td class="lbl">Premium share<span class="sub">≥ ${money(C.threshold)} SAR</span></td>${
        cols.map(w=>`<td>${pf(C.weeks[w].premShare)}</td>`).join('')}<td>—</td></tr>`;
    h+=`</tbody></table></div></section>`;
  }

  /* brand ranking across the chosen weeks, expandable to product mix */
  if(!C.appleOnly){
    const bm=new Map();
    cols.forEach(w=>{
      (C.weeks[w].brands||[]).forEach(b=>{
        if(!bm.has(b.name)) bm.set(b.name,{name:b.name,by:{},total:0,dev:new Map()});
        const e=bm.get(b.name);
        e.by[w]=(e.by[w]||0)+b.units; e.total+=b.units;
        (b.devices||[]).forEach(x=>{
          const k=x.device+'|'+x.storage;
          if(!e.dev.has(k)) e.dev.set(k,{device:x.device,storage:x.storage,price:x.price,units:0});
          const dd=e.dev.get(k); dd.units+=x.units; dd.price=Math.max(dd.price||0,x.price||0);
        });
      });
    });
    const brands=[...bm.values()].filter(b=>b.total!==0).sort((a,b)=>b.total-a.total);
    const grand=brands.reduce((a,b)=>a+b.total,0);
    h+=`<section class="card"><div class="card-h"><p class="card-t">Brand ranking</p></div>
      <div class="cmpwrap"><table class="cmp"><thead><tr><th class="lbl">&nbsp;</th>${
        cols.map(th).join('')}<th>Total</th><th>Share</th></tr></thead><tbody>`;
    brands.forEach((b,bi)=>{
      const nice=b.name==='APPLE'?'Apple':b.name.charAt(0)+b.name.slice(1).toLowerCase();
      const kids=[...b.dev.values()].filter(x=>x.units!==0)
                  .sort((p,q)=> q.units-p.units || (q.price||0)-(p.price||0));
      h+=`<tr class="tierrow${kids.length?' tappable':''}" ${kids.length?`data-t="b${bi}" aria-expanded="false" role="button" tabindex="0"`:''}>
        <td class="lbl">${kids.length?'<span class="tw">›</span>':''}<span${b.name==='APPLE'?' style="color:var(--blue)"':''}>${nice}</span></td>${
        cols.map(w=>`<td>${b.by[w]?nf(b.by[w]):'—'}</td>`).join('')
        }<td class="tot">${nf(b.total)}</td><td>${grand?(b.total/grand*100).toFixed(1)+'%':'—'}</td></tr>`;
      kids.forEach(x=>{
        h+=`<tr class="modelrow tb${bi}" hidden>
          <td class="lbl mdl">${x.device}${x.storage&&x.storage!=='—'?' · '+x.storage:''}
            <span class="sub">${x.price?money(x.price)+' SAR':''}</span></td>${
          cols.map(()=>'<td></td>').join('')}<td class="tot">${nf(x.units)}</td>
          <td>${b.total?(x.units/b.total*100).toFixed(1)+'%':'—'}</td></tr>`;
      });
    });
    h+=`</tbody></table></div></section>`;
  }

  /* devices across the chosen weeks */
  const map=new Map();
  cols.forEach(w=>{
    C.weeks[w].devices.filter(x=>inTier(x)).forEach(x=>{
      const k=x.brand+'|'+x.device+'|'+x.storage;
      if(!map.has(k)) map.set(k,{brand:x.brand,device:x.device,storage:x.storage,by:{},total:0});
      const e=map.get(k); e.by[w]=(e.by[w]||0)+x.units; e.total+=x.units;
    });
  });
  const rows=[...map.values()].sort((a,b)=>b.total-a.total);

  h+=`<section class="card"><div class="card-h"><p class="card-t">${C.appleOnly?'Models':'Devices'}</p></div>
    <div class="srch"><svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
      <circle cx="7" cy="7" r="5" stroke="currentColor" stroke-width="1.8"/>
      <path d="M11 11l3.2 3.2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <input id="q" type="search" placeholder="Search devices" aria-label="Search devices"
             autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="search">
      <button id="qx" type="button" aria-label="Clear search" hidden>&times;</button>
    </div>
    <p class="qnone" id="qnone" hidden>No matching devices</p>
    <div class="cmpwrap"><table class="cmp"><thead><tr><th class="lbl">&nbsp;</th>${cols.map(th).join('')}<th>Total</th></tr></thead><tbody>`;
  rows.forEach(r=>{
    const q=`${r.brand} ${r.device} ${r.storage||''}`.toLowerCase().replace(/"/g,'');
    h+=`<tr class="${r.brand==='APPLE'?'apple':''}" data-q="${q}">
      <td class="lbl">${r.device}${r.storage&&r.storage!=='—'?`<span class="sub">${r.storage}</span>`:''}</td>
      ${cols.map(w=>`<td>${r.by[w]?nf(r.by[w]):'—'}</td>`).join('')}
      <td class="tot">${nf(r.total)}</td></tr>`;
  });
  h+=`</tbody></table></div></section>`;
  m.innerHTML=h;

  /* tier disclosure */
  m.querySelectorAll('tr.tierrow.tappable').forEach(tr=>{
    onTap(tr, ()=>{
      const open = tr.getAttribute('aria-expanded')==='true';
      tr.setAttribute('aria-expanded', !open);
      m.querySelectorAll(`tr.modelrow.t${tr.dataset.t}`).forEach(r=>{ r.hidden = open; });
    });
    tr.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault();
      const open=tr.getAttribute('aria-expanded')==='true';
      tr.setAttribute('aria-expanded',!open);
      m.querySelectorAll(`tr.modelrow.t${tr.dataset.t}`).forEach(r=>{ r.hidden=open; }); } });
  });

  /* search works here too */
  const qEl=m.querySelector('#q'), qx=m.querySelector('#qx'), qnone=m.querySelector('#qnone');
  function applyFilter(){
    const t=(query||'').trim().toLowerCase(); let shown=0;
    m.querySelectorAll('tr[data-q]').forEach(tr=>{
      const hit=!t || tr.dataset.q.includes(t);
      tr.style.display = hit ? '' : 'none';
      if(hit) shown++;
    });
    if(qnone) qnone.hidden = shown>0;
    if(qx) qx.hidden = !t;
  }
  qEl.value=query;
  qEl.addEventListener('input',()=>{ query=qEl.value; applyFilter(); });
  qx.addEventListener('click',()=>{ query=''; qEl.value=''; applyFilter(); qEl.focus(); });
  applyFilter();
}

/* ---- render ---- */
function render(){
  moveThumb();
  const T = C_tiers();
  tiersEl.hidden = !T;
  if(!T) tier='all';
  else [...tiersEl.children].forEach(b=>b.setAttribute('aria-pressed', b.dataset.t===tier));
  cmpBtn.setAttribute('aria-pressed', compare);
  [...weeksEl.children].forEach(b=>{
    const w=b.dataset.w;
    b.setAttribute('aria-pressed', compare ? sel.has(w) : w===wk);
    b.style.opacity = (compare && w==='ALL') ? .35 : 1;   // ALL is inert while comparing
  });
  if(compare){ renderCompare(); return; }
  const C=D.categories[cat], d=C.weeks[wk], m=document.getElementById('main');
  const T0 = C_tiers();
  const appleUnits = (T0 && tier!=='all') ? (tierUnits(wk,'ty') ?? 0) : C.weeks[wk].apple;
  const p=prevWeek(wk);
  const pv=p ? ((T0 && tier!=='all') ? tierUnits(p,'ty') : C.weeks[p].apple) : null;
  let dl='', cls='flat', note='';
  if(pv){ const x=(appleUnits-pv)/pv; cls=x>0?'up':(x<0?'dn':'flat');
    dl=(x>0?'▲ ':(x<0?'▼ ':''))+(x*100).toFixed(1)+'%'+` vs ${p}`; }
  else dl='—';
  /* On the whole-period view, swap the (meaningless) WoW badge for year-over-year,
     summed across exactly the weeks we hold data for so it stays honest as W7+ arrive. */
  if(wk==='ALL' && (C.lastYear || (T0 && tier!=='all'))){
    const wks = D.weeks.filter(w=>w!=='ALL');
    /* Only compare if we hold last-year data for every week on screen —
       a missing week silently summing as zero would understate the base
       and overstate growth. Better to show nothing than a wrong number. */
    const lyOf = w => (T0 && tier!=='all') ? tierUnits(w,'ly') : C.lastYear[w];
    const complete = wks.every(w=> typeof lyOf(w) === 'number');
    const ly = complete ? wks.reduce((a,w)=> a + lyOf(w), 0) : 0;
    const tyTot = complete ? wks.reduce((a,w)=> a + ((T0 && tier!=='all') ? (tierUnits(w,'ty')??0) : C.weeks[w].apple), 0) : 0;
    if(complete && ly){
      const y=(tyTot-ly)/ly;
      cls = y>0?'up':(y<0?'dn':'flat');
      dl = (y>0?'▲ ':(y<0?'▼ ':''))+(y*100).toFixed(1)+'% Y/Y';
      note = `<p class="ynote">${nf(ly)} units in the same weeks last year</p>`;
    }
  }

  let h='';
  /* hero */
  h+=`<section class="card"><div class="card-h"><p class="card-t">Apple units sold</p></div>
    <div class="hero"><p class="big">${nf(appleUnits)}<small>units</small></p>
    <span class="delta ${cls}">${dl}</span></div>${note}${
      (D.provisional||[]).includes(wk) ? `<p class="prov">Provisional — ${wk} Apple units are from the transaction feed, not the LOB report</p>` : ''}`;

  if(!C.appleOnly && tier==='all'){
    let od='—', ocls='flat';
    if(wk==='ALL' && C.lastYearOther){
      /* whole period has no prior week — compare with last year instead */
      const wks=D.weeks.filter(x=>x!=='ALL');
      const okAll=wks.every(x=> typeof C.lastYearOther[x]==='number');
      if(okAll){
        const lo=wks.reduce((a,x)=>a+C.lastYearOther[x],0);
        const cur=wks.reduce((a,x)=>a+C.weeks[x].other,0);
        if(lo){ const ox=(cur-lo)/lo; ocls=ox>0?'up':(ox<0?'dn':'flat');
          od=(ox>0?'▲ ':(ox<0?'▼ ':''))+(ox*100).toFixed(1)+'% Y/Y'; }
      }
    } else if(p){ const opv=C.weeks[p].other;
      if(opv){ const ox=(d.other-opv)/opv; ocls=ox>0?'up':(ox<0?'dn':'flat');
        od=(ox>0?'▲ ':(ox<0?'▼ ':''))+(ox*100).toFixed(1)+'%'; } }
    h+=`<div class="share"><div class="bar"><i style="width:${(d.share*100).toFixed(1)}%"></i></div>
      <div class="legend"><span><b>${pf(d.share)}</b> Apple</span>
      <span>${nf(d.other)} other brands</span></div>
      <div class="legend legend2"><span></span>
      <span class="ow ${ocls}">${od}${p?` vs ${p}`:''}</span></div></div>
      <dl class="grid">
        <div class="stat"><dt>Premium share ≥ ${money(C.threshold)} SAR</dt><dd>${pf(d.premShare)}</dd></div>
        <div class="stat"><dt>Others premium units</dt><dd>${nf(d.otherPrem)}</dd></div>
      </dl>`;
  }
  h+=`</section>`;

  /* devices */
  h+=`<section class="card"><div class="card-h"><p class="card-t">${C.appleOnly?'Models':'Devices'} · ${wk==='ALL'?'whole period':wk}</p></div>
    <div class="srch"><svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
      <circle cx="7" cy="7" r="5" stroke="currentColor" stroke-width="1.8"/>
      <path d="M11 11l3.2 3.2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <input id="q" type="search" placeholder="Search devices" aria-label="Search devices"
             autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="search">
      <button id="qx" type="button" aria-label="Clear search" hidden>&times;</button>
    </div>
    <p class="qnone" id="qnone" hidden>No matching devices</p>`;
  if(!d.devices.length) h+=`<p class="empty">No sales this week</p>`;
  d.devices.filter(x=>inTier(x)).forEach((x,i)=>{
    const has=x.colors.length>0;
    const q=`${x.brand} ${x.device} ${x.storage||''}`.toLowerCase();
    h+=`<div class="row ${has?'tappable':''}" data-q="${q.replace(/"/g,'')}" ${has?`data-i="${i}" aria-expanded="false" role="button" tabindex="0"`:''}>
      <svg class="chev ${has?'':'hidden'}" viewBox="0 0 10 16" fill="none" aria-hidden="true">
        <path d="M2 1.5 8.5 8 2 14.5" stroke="currentColor" stroke-width="2.2"
              stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span class="nm"><b>${x.device}</b>
        <span>${x.storage&&x.storage!=='—'?x.storage+' · ':''}${money(x.price)} SAR</span></span>
      ${x.brand==='APPLE'&&!C.appleOnly?'<span class="badge apple">Apple</span>':''}
      <span class="u">${nf(x.units)}</span></div>`;
    if(has){
      h+=`<div class="kids" data-k="${i}" data-qk="${q.replace(/"/g,'')}"><div>`;
      x.colors.forEach(c=>{ h+=`<div class="kid"><span>${c.name}</span><b>${nf(c.units)}</b></div>`; });
      h+=`</div></div>`;
    }
  });
  h+=`</section>`;

  /* brand ranking */
  if(!C.appleOnly && tier==='all' && d.brands.length){
    const max=d.brands[0].units;
    h+=`<section class="card"><div class="card-h"><p class="card-t">Brand ranking</p></div>`;
    d.brands.forEach((b,bi)=>{
      const nice=b.name==='APPLE'?'Apple':b.name.charAt(0)+b.name.slice(1).toLowerCase();
      const has=b.devices&&b.devices.length>0;
      h+=`<div class="row ${has?'tappable':''}" ${has?`data-b="${bi}" aria-expanded="false" role="button" tabindex="0"`:''}>
        <svg class="chev ${has?'':'hidden'}" viewBox="0 0 10 16" fill="none" aria-hidden="true">
          <path d="M2 1.5 8.5 8 2 14.5" stroke="currentColor" stroke-width="2.2"
                stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span class="nm"><b${b.name==='APPLE'?' style="color:var(--blue)"':''}>${nice}</b>
        <span><span style="display:inline-block;height:4px;border-radius:2px;vertical-align:middle;
          width:${Math.max(6,(b.units/max)*118)}px;background:${b.name==='APPLE'?'var(--blue)':'var(--label3)'}"></span></span>
        </span><span class="u">${nf(b.units)}<span class="ush">${
          d.total ? (b.units/d.total*100).toFixed(1)+'%' : '—'}</span></span></div>`;
      if(has){
        h+=`<div class="kids" data-bk="${bi}"><div>`;
        /* product mix within the brand: biggest seller first, ties broken by price */
        [...b.devices]
          .sort((p,q)=> q.units - p.units || (q.price||0) - (p.price||0))
          .forEach(x=>{
            const mix = b.units ? (x.units/b.units*100) : 0;
            h+=`<div class="kid">
              <span>${x.device}${x.storage&&x.storage!=='—'?' · '+x.storage:''}
                <em>${x.price?money(x.price)+' SAR':''}</em></span>
              <b>${nf(x.units)}<i>${mix.toFixed(1)}%</i></b></div>`;
          });
        h+=`</div></div>`;
      }
    });
    h+=`</section>`;
  }
  m.innerHTML=h;


  /* search */
  const qEl=m.querySelector('#q'), qx=m.querySelector('#qx'), qnone=m.querySelector('#qnone');
  function applyFilter(){
    const t=(query||'').trim().toLowerCase();
    let shown=0;
    m.querySelectorAll('.row[data-q]').forEach(r=>{
      const hit = !t || r.dataset.q.includes(t);
      r.classList.toggle('hide', !hit);
      if(hit) shown++;
    });
    m.querySelectorAll('.kids[data-qk]').forEach(k=>{
      k.classList.toggle('hide', !(!t || k.dataset.qk.includes(t)));
    });
    if(qnone) qnone.hidden = shown>0;
    if(qx) qx.hidden = !t;
  }
  if(qEl){
    qEl.value = query;
    qEl.addEventListener('input', ()=>{ query=qEl.value; applyFilter(); });
    qx.addEventListener('click', ()=>{ query=''; qEl.value=''; applyFilter(); qEl.focus(); });
    applyFilter();
  }

  m.querySelectorAll('.row.tappable').forEach(r=>{
    const go=()=>{
      const sel = r.dataset.b!==undefined ? `.kids[data-bk="${r.dataset.b}"]` : `.kids[data-k="${r.dataset.i}"]`;
      const k=m.querySelector(sel);
      const open=r.getAttribute('aria-expanded')==='true';
      r.setAttribute('aria-expanded',!open);
      k.classList.toggle('open',!open);
    };
    onTap(r, go);
    r.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){e.preventDefault();go();} });
  });
}
function boot(data){
  D = data;
  CATS = Object.keys(D.categories);
  if(!CATS.includes(cat)) cat = CATS[0];
  buildSeg(); buildWeeks(); buildTiers(); render();
  requestAnimationFrame(moveThumb);
}
addEventListener('resize',()=>{ if(D) moveThumb(); });

/* ---------- decryption ---------- */
const lock=document.getElementById('lock'), pw=document.getElementById('pw'),
      goBtn=document.getElementById('go'), lockmsg=document.getElementById('lockmsg');
const b64d = s => Uint8Array.from(atob(s), c=>c.charCodeAt(0));

let busy=false;
async function unlock(){
  const pass = pw.value;
  if(!pass || busy) return;
  busy = true;
  goBtn.disabled = true; lockmsg.classList.remove('bad');
  lockmsg.textContent = 'Decrypting…';
  await new Promise(r=>setTimeout(r,20));
  try{
    const blob = b64d(document.getElementById('payload').textContent.trim());
    const salt = blob.slice(0,16), iv = blob.slice(16,28), ct = blob.slice(28);
    const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey(
      {name:'PBKDF2', salt, iterations:250000, hash:'SHA-256'},
      km, {name:'AES-GCM', length:256}, false, ['decrypt']);
    const plain = await crypto.subtle.decrypt({name:'AES-GCM', iv}, key, ct);
    const data = JSON.parse(new TextDecoder().decode(plain));
    boot(data);
    lock.classList.add('gone');
    setTimeout(()=>lock.remove(), 360);
  }catch(e){
    busy = false;
    goBtn.disabled = false;
    lockmsg.textContent = 'Wrong passcode — try again';
    lockmsg.classList.add('bad');
    const box=document.querySelector('.lockbox');
    box.classList.add('shake');
    setTimeout(()=>box.classList.remove('shake'), 420);
    pw.value = '';
    pw.focus();
  }
}
const PIN_LEN = 6;
goBtn.addEventListener('click', unlock);
pw.addEventListener('keydown', e=>{ if(e.key==='Enter') unlock(); });
pw.addEventListener('input', ()=>{
  const v = pw.value.replace(/\D/g,'').slice(0, PIN_LEN);
  if(v !== pw.value) pw.value = v;          // digits only, hard cap at six
  if(lockmsg.classList.contains('bad') && v.length < PIN_LEN){
    lockmsg.classList.remove('bad');
    lockmsg.textContent = 'Enter passcode to view the report';
  }
  if(v.length === PIN_LEN) unlock();        // submit itself on the last digit
});
addEventListener('load', ()=>pw.focus());
</script>
